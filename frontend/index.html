<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Debrief - Incident Response</title>
  <script>
    // Applica il tema (salvato o quello di sistema) PRIMA del render di React,
    // così non c'è il "lampo" di tema chiaro all'avvio. Mette la classe .dark
    // su <html>, che attiva il blocco .dark di index.css.
    (function () {
      var saved = localStorage.getItem("theme")
      var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches
      document.documentElement.classList.toggle("dark", dark)
    })()
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
