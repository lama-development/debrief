[project]
name = "debrief"
version = "0.1.0"
description = "Incident Response Multi-Agent Platform"
requires-python = ">=3.11"
dependencies = [
    "agno",
    "groq",
    "lancedb",
    "sentence-transformers",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "python-dotenv",
    "bcrypt",
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
]

[project.scripts]
seed = "seed.run_seed:main"
dev = "debrief.api.app:main"
eval = "eval.run_eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# I console script `seed` ed `eval` importano i package top-level `seed` ed `eval`.
# Con il layout src/, hatchling impacchetta in automatico solo `src/debrief`: qui
# dichiariamo esplicitamente anche `seed` ed `eval` così `uv run seed` / `uv run eval`
# risolvono l'import. (Richiedono un __init__.py nella rispettiva cartella.)
[tool.hatch.build.targets.wheel]
packages = ["src/debrief", "seed", "eval"]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]